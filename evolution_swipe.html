<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolution Swipe: 척추동물 잔혹 진화사</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', 'sans-serif'],
                    },
                    colors: {
                        evoDark: '#0f172a',
                        evoCard: '#1e293b',
                        evoAccent: '#10b981',
                        evoDanger: '#ef4444',
                        evoGold: '#f59e0b',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
        }

        .card-container {
            perspective: 1000px;
        }

        .swipe-card {
            transition: transform 0.1s ease-out, box-shadow 0.2s ease;
            will-change: transform;
            cursor: grab;
        }

        .swipe-card:active {
            cursor: grabbing;
        }

        .swipe-card.animating {
            transition: transform 0.4s ease-out, opacity 0.4s ease-out;
        }

        .choice-badge {
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom Scrollbar for Tree Modal */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-evoDark text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden">

    <header class="w-full max-w-md mx-auto p-4 flex justify-between items-center z-10">
        <div class="flex items-center space-x-2">
            <div class="p-2 bg-emerald-500/20 text-emerald-400 rounded-lg border border-emerald-500/30">
                <i class="fa-solid fa-dna text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight text-slate-100 leading-none">EVO SWIPE</h1>
                <p class="text-xs text-slate-400 font-medium mt-0.5">척추동물 잔혹 진화사</p>
            </div>
        </div>

        <button id="openTreeBtn" class="flex items-center space-x-1.5 px-3 py-1.5 glass-panel rounded-full text-xs font-semibold text-emerald-400 hover:bg-slate-700/50 transition">
            <i class="fa-solid fa-sitemap"></i>
            <span>진화 계통도</span>
        </button>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-4 max-w-md mx-auto w-full relative">
        
        <!-- Era & Species Badge -->
        <div class="text-center mb-4">
            <span id="eraBadge" class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 mb-1">
                캄브리아기 (약 5억 년 전)
            </span>
            <h2 id="speciesTitle" class="text-2xl font-extrabold text-slate-100 tracking-tight">
                원시 척삭동물 (피카이아)
            </h2>
        </div>

        <!-- Card Container -->
        <div class="card-container w-full h-[380px] relative flex justify-center items-center">
            
            <!-- Swipe Card -->
            <div id="swipeCard" class="swipe-card absolute w-full h-full glass-panel rounded-3xl p-6 flex flex-col justify-between shadow-2xl border border-slate-700/50 overflow-hidden">
                
                <!-- Overlay Choice Indicator Badges -->
                <div id="badgeLeft" class="choice-badge absolute top-6 right-6 bg-rose-500/90 text-white font-bold text-sm px-4 py-2 rounded-xl shadow-lg transform rotate-6 border border-rose-400 z-20 pointer-events-none">
                    <span id="badgeLeftText">선택 A</span>
                </div>
                <div id="badgeRight" class="choice-badge absolute top-6 left-6 bg-emerald-500/90 text-white font-bold text-sm px-4 py-2 rounded-xl shadow-lg transform -rotate-6 border border-emerald-400 z-20 pointer-events-none">
                    <span id="badgeRightText">선택 B</span>
                </div>

                <!-- Card Visual / Icon Header -->
                <div class="w-full flex justify-center items-center py-4 relative">
                    <div class="w-28 h-28 rounded-2xl bg-gradient-to-br from-slate-800 to-slate-900 flex items-center justify-center border border-slate-700/60 shadow-inner relative group">
                        <div id="cardIcon" class="text-5xl text-emerald-400 transform transition group-hover:scale-110">
                            <i class="fa-solid fa-worm"></i>
                        </div>
                    </div>
                </div>

                <!-- Scenario Description -->
                <div class="my-auto text-center px-2">
                    <p id="scenarioText" class="text-slate-300 text-sm sm:text-base leading-relaxed font-medium">
                        바다 속에 아노말로카리스 같은 거대한 포식자가 등장했습니다! 살아남기 위해 어떻게 몸을 변형할까요?
                    </p>
                </div>

                <!-- Swipe Guide Hint -->
                <div class="text-center pt-2 border-t border-slate-800/80 text-xs text-slate-500 flex justify-between items-center">
                    <span><i class="fa-solid fa-arrow-left text-rose-400 mr-1"></i> 드래그 / ←</span>
                    <span class="font-semibold text-slate-400">선택</span>
                    <span>→ / 드래그 <i class="fa-solid fa-arrow-right text-emerald-400 ml-1"></i></span>
                </div>
            </div>
        </div>

        <!-- Action Control Buttons -->
        <div class="w-full grid grid-cols-2 gap-3 mt-6">
            <button id="btnLeft" class="group relative px-4 py-3 bg-slate-800 hover:bg-rose-950/40 border border-slate-700 hover:border-rose-500/50 rounded-2xl text-left transition duration-200 flex flex-col justify-between">
                <div class="flex items-center text-xs font-bold text-rose-400 mb-1">
                    <i class="fa-solid fa-circle-arrow-left mr-1.5"></i> 왼쪽 선택
                </div>
                <span id="btnLeftLabel" class="text-xs text-slate-300 font-medium line-clamp-2">
                    단단한 외골격을 두른다
                </span>
            </button>

            <button id="btnRight" class="group relative px-4 py-3 bg-slate-800 hover:bg-emerald-950/40 border border-slate-700 hover:border-emerald-500/50 rounded-2xl text-left transition duration-200 flex flex-col justify-between">
                <div class="flex items-center text-xs font-bold text-emerald-400 mb-1">
                    오른쪽 선택 <i class="fa-solid fa-circle-arrow-right ml-1.5"></i>
                </div>
                <span id="btnRightLabel" class="text-xs text-slate-300 font-medium line-clamp-2">
                    유연한 척삭과 지느러미 발달
                </span>
            </button>
        </div>
    </main>

    <!-- Footer Stats / Nodes Unlocked -->
    <footer class="w-full max-w-md mx-auto p-4 text-center text-xs text-slate-500">
        해금된 계통도 엔딩: <span id="codexProgress" class="text-emerald-400 font-bold">0</span> / <span id="codexTotal">10</span>
    </footer>

    <div id="endingModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel max-w-sm w-full rounded-3xl p-6 border border-slate-700 shadow-2xl text-center transform scale-95 transition-transform duration-300 flex flex-col items-center">
            
            <div id="endingBadge" class="w-16 h-16 rounded-full flex items-center justify-center text-3xl mb-4 border shadow-lg">
                <i id="endingIcon" class="fa-solid fa-skull"></i>
            </div>

            <span id="endingTypeTag" class="text-xs font-bold px-3 py-1 rounded-full mb-2 uppercase tracking-wider">
                멸종 엔딩
            </span>

            <h3 id="endingTitle" class="text-xl font-extrabold text-slate-100 mb-2">
                데본기 대멸종
            </h3>

            <p id="endingDesc" class="text-xs sm:text-sm text-slate-300 leading-relaxed mb-6 font-medium">
                단단한 갑옷을 두르는 데 성공했지만, 기후 변화로 먹이가 줄어들자 비효율적인 몸집을 유지하지 못하고 모두 기아로 멸종했습니다.
            </p>

            <button id="restartBtn" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-bold rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-rotate-left"></i>
                <span>다시 진화 시작하기</span>
            </button>
        </div>
    </div>

    <div id="treeModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel max-w-md w-full max-h-[85vh] rounded-3xl p-5 border border-slate-700 shadow-2xl flex flex-col">
            
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-700/60">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-sitemap text-emerald-400 text-lg"></i>
                    <h3 class="font-bold text-slate-100 text-base">척추동물 진화 도감</h3>
                </div>
                <button id="closeTreeBtn" class="text-slate-400 hover:text-slate-100 text-lg p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Tree List Content -->
            <div id="treeContent" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <!-- JS will dynamically populate nodes here -->
            </div>
        </div>
    </div>

    <script>
        // Game Tree Data Structure
        const EVOLUTION_TREE = {
            'pikaia': {

                left: {
                    label: '단단한 외골격 방어 갑옷을 두른다',
                    nodeId: 'placoderm'

                right: {
                    label: '유연한 척삭과 지느러미로 도망친다',

            // Branch 1A: Placoderm (Extinction)
            'placoderm': {
                isEnding: true,

                desc: '단단한 외골격으로 몸을 보호하는 데 성공했으나, 데본기 말 급격한 해수면 변화 및 산소 부족 사태 시 무거운 몸을 이끌지 못하고 전멸했습니다.'
            },

            // Branch 1B: Jawed Fish
            'jawed_fish': {

                icon: 'fa-fish',
                scenario: '더 강력하게 먹이를 씹고 헤엄치기 위해 골격을 발달시켜야 합니다. 어떤 골격을 선택할까요?',
                left: {
                    label: '가볍고 유연한 연골(무른뼈)',

            'shark': {

            },

            // Branch 2B: Tiktaalik
            'tiktaalik': {
                title: '육지느러미어류 (틱타알릭)',
                era: '데본기 (약 3억 7500만 년 전)',
                icon: 'fa-frog',
                scenario: '얕은 물가에 산소가 부족해집니다! 대신 물 밖 육지에는 곤충과 먹이가 풍부해 보입니다.',
                left: {
                    label: '물이 좋아! 심해로 들어가 수중 생활 고수',

            },

            // Branch 3B: Amphibian
            'amphibian': {

            'extinct_amphibian': {

                left: {
                    label: '몸집을 키워 공룡과 정면으로 대결한다',
                    nodeId: 'extinct_synapsid'
                },
                right: {
                    label: '몸집을 쥐처럼 줄이고 밤에 활동하며 젖을 먹인다',
                    nodeId: 'mammal'
                }
            },

            // Branch 6A: Extinct Synapsid (Extinction)
            'extinct_synapsid': {
                isEnding: true,
                endingType: 'extinction',
                title: '공룡 세력에 의한 도태',
                icon: 'fa-bone',
                badgeColor: 'bg-rose-500/20 text-rose-400 border-rose-500/30',
                desc: '직립 보행을 완성한 공룡의 힘과 속도를 당해내지 못하고 일찍이 포식당해 멸종했습니다.'
            },

            // Branch 6B: Mammal Line
            'mammal': {
                title: '원시 포유류 (신생대 진입)',
                era: '신생대 (약 6천 6백만 년 전 운석 충돌 이후)',
                icon: 'fa-hippo',
                scenario: '운석 충돌로 공룡이 전멸했습니다! 비어있는 지구 생태계에서 어떤 방향으로 지능과 생체를 발전시킬까요?',
                left: {
                    label: '대뇌를 극도로 발달시키고 도구를 사용한다',
                    nodeId: 'human'
                },
                right: {
                    label: '거대한 몸집으로 풀을 뜯거나 바다로 돌아간다',
                    nodeId: 'whale'
                }
            },

            // Branch 7A: Human (Victory)
            'human': {
                isEnding: true,
                endingType: 'victory',
                title: '만물의 영장 (슬기로운 사람 - 인간)',

                badgeColor: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30',
                desc: '높은 지능과 도구 사용, 정교한 사회성을 통해 지구를 넘어 우주를 바라보는 유일한 생명체로 진화했습니다!'

                isEnding: true,
                endingType: 'victory',

            },

            // Branch 5B: Diapsid Line (Dinosaur & Reptile side)
            'diapsid': {

                icon: 'fa-dragon',
                scenario: '다리 골격 구조를 개량하려 합니다. 어떤 관절 방식을 취할까요?',

            'reptile': {
                isEnding: true,
                endingType: 'victory',
                title: '생존의 마스터 (악어 / 뱀 / 도마뱀)',
                icon: 'fa-staff-snake',
                badgeColor: 'bg-lime-500/20 text-lime-400 border-lime-500/30',
                desc: '낮은 신진대사와 탁월한 은신 능력으로 수억 년간 대멸종을 모두 피하고 살아남은 완벽한 생존자입니다!'
            },

            // Branch 6D: Dinosaur
            'dinosaur': {
                title: '중생대의 지배자 (공룡)',
                era: '백악기 말 (약 6천 8백만 년 전)',
                icon: 'fa-locust',
                scenario: '우주에서 거대한 운석이 지구로 돌진하고 있습니다! 환경 대변화에 어떻게 대비할까요?',
                left: {
                    label: '더 거대한 뿔과 무거운 갑옷 껍질로 무장',
                    nodeId: 'extinct_trex'
                },
                right: {
                    label: '뼈 속을 비우고 깃털을 달아 하늘로 날아오른다',
                    nodeId: 'bird'
                }
            },

            // Branch 7C: Extinct Trex (Extinction)
            'extinct_trex': {
                isEnding: true,
                endingType: 'extinction',
                title: '운석 충돌 대멸종 (티라노사우루스)',
                icon: 'fa-meteor',
                badgeColor: 'bg-rose-500/20 text-rose-400 border-rose-500/30',
                desc: '거대한 덩치는 운석 충돌 후 닥쳐온 장기간의 겨울과 식량 부족을 견디지 못하고 단 며칠 만에 사멸했습니다.'
            },

            // Branch 7D: Bird (Victory)
            'bird': {
                isEnding: true,
                endingType: 'victory',
                title: '천공의 지배자 (조류 - 독수리 / 매)',
                icon: 'fa-crow',
                badgeColor: 'bg-amber-500/20 text-amber-400 border-amber-500/30',
                desc: '공룡의 후예로서 하늘을 정복했습니다! 운석 충돌 속에서도 가벼운 몸과 비행 능력으로 생존에 성공했습니다.'
            }
        };

        // Total Endings Count
        const TOTAL_ENDINGS = Object.values(EVOLUTION_TREE).filter(node => node.isEnding).length;

        let currentNodeId = 'pikaia';
        let unlockedEndings = new Set(JSON.parse(localStorage.getItem('evo_unlocked_endings') || '[]'));

        // DOM Elements
        const eraBadge = document.getElementById('eraBadge');
        const speciesTitle = document.getElementById('speciesTitle');
        const scenarioText = document.getElementById('scenarioText');
        const cardIcon = document.getElementById('cardIcon');
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnLeftLabel = document.getElementById('btnLeftLabel');
        const btnRightLabel = document.getElementById('btnRightLabel');
        const swipeCard = document.getElementById('swipeCard');
        const badgeLeft = document.getElementById('badgeLeft');
        const badgeRight = document.getElementById('badgeRight');
        const badgeLeftText = document.getElementById('badgeLeftText');
        const badgeRightText = document.getElementById('badgeRightText');
        
        const endingModal = document.getElementById('endingModal');
        const endingIcon = document.getElementById('endingIcon');
        const endingBadge = document.getElementById('endingBadge');
        const endingTypeTag = document.getElementById('endingTypeTag');
        const endingTitle = document.getElementById('endingTitle');
        const endingDesc = document.getElementById('endingDesc');
        const restartBtn = document.getElementById('restartBtn');

        const treeModal = document.getElementById('treeModal');
        const openTreeBtn = document.getElementById('openTreeBtn');
        const closeTreeBtn = document.getElementById('closeTreeBtn');
        const treeContent = document.getElementById('treeContent');
        const codexProgress = document.getElementById('codexProgress');
        const codexTotal = document.getElementById('codexTotal');

        codexTotal.textContent = TOTAL_ENDINGS;

        function renderNode(nodeId) {
            const node = EVOLUTION_TREE[nodeId];
            if (!node) return;

            if (node.isEnding) {
                showEndingModal(node, nodeId);
                return;
            }

            currentNodeId = nodeId;

            // Update UI Card Text
            eraBadge.textContent = node.era;
            speciesTitle.textContent = node.title;
            scenarioText.textContent = node.scenario;
            cardIcon.innerHTML = `<i class="fa-solid ${node.icon}"></i>`;

            // Button Labels
            btnLeftLabel.textContent = node.left.label;
            btnRightLabel.textContent = node.right.label;

            // Overlay Badge Text
            badgeLeftText.textContent = node.left.label;
            badgeRightText.textContent = node.right.label;

            // Reset Card Position & Badges
            resetCardPosition();
            updateProgress();
        }

        function resetCardPosition() {
            swipeCard.classList.remove('animating');
            swipeCard.style.transform = 'translateX(0px) rotate(0deg)';
            badgeLeft.style.opacity = '0';
            badgeRight.style.opacity = '0';
        }

        function updateProgress() {
            codexProgress.textContent = unlockedEndings.size;
        }

        function showEndingModal(endingNode, endingId) {
            unlockedEndings.add(endingId);
            localStorage.setItem('evo_unlocked_endings', JSON.stringify([...unlockedEndings]));
            updateProgress();

            const isVictory = endingNode.endingType === 'victory';

            endingBadge.className = `w-16 h-16 rounded-full flex items-center justify-center text-3xl mb-4 border shadow-lg ${endingNode.badgeColor}`;
            endingIcon.className = `fa-solid ${endingNode.icon}`;
            
            endingTypeTag.textContent = isVictory ? '성공한 종 엔딩' : '멸종 엔딩';
            endingTypeTag.className = isVictory 
                ? 'text-xs font-bold px-3 py-1 rounded-full mb-2 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                : 'text-xs font-bold px-3 py-1 rounded-full mb-2 bg-rose-500/20 text-rose-400 border border-rose-500/30';

            endingTitle.textContent = endingNode.title;
            endingDesc.textContent = endingNode.desc;

            endingModal.classList.remove('hidden');
            setTimeout(() => {
                endingModal.classList.remove('opacity-0');
                endingModal.querySelector('div').classList.remove('scale-95');
                endingModal.querySelector('div').classList.add('scale-100');
            }, 10);
        }

        function hideEndingModal() {
            endingModal.classList.add('opacity-0');
            endingModal.querySelector('div').classList.remove('scale-100');
            endingModal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                endingModal.classList.add('hidden');
                renderNode('pikaia');
            }, 300);
        }

        let startX = 0;
        let currentX = 0;
        let isDragging = false;

        function onTouchStart(e) {
            isDragging = true;
            startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            swipeCard.classList.remove('animating');
        }

        function onTouchMove(e) {
            if (!isDragging) return;
            currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const deltaX = currentX - startX;
            const rotation = deltaX * 0.08;

            swipeCard.style.transform = `translateX(${deltaX}px) rotate(${rotation}deg)`;

            // Badge opacity based on drag distance
            if (deltaX < -30) {
                badgeLeft.style.opacity = Math.min(Math.abs(deltaX) / 100, 1);
                badgeRight.style.opacity = '0';
            } else if (deltaX > 30) {
                badgeRight.style.opacity = Math.min(deltaX / 100, 1);
                badgeLeft.style.opacity = '0';
            } else {
                badgeLeft.style.opacity = '0';
                badgeRight.style.opacity = '0';
            }
        }

        function onTouchEnd() {
            if (!isDragging) return;
            isDragging = false;
            const deltaX = currentX - startX;
            const threshold = 80;

            swipeCard.classList.add('animating');

            if (deltaX < -threshold) {
                // Swiped Left
                swipeCard.style.transform = 'translateX(-500px) rotate(-30deg)';
                setTimeout(() => makeChoice('left'), 200);
            } else if (deltaX > threshold) {
                // Swiped Right
                swipeCard.style.transform = 'translateX(500px) rotate(30deg)';
                setTimeout(() => makeChoice('right'), 200);
            } else {
                // Reset back to center
                resetCardPosition();
            }
            startX = 0;
            currentX = 0;
        }

        function makeChoice(direction) {
            const node = EVOLUTION_TREE[currentNodeId];
            if (!node || !node[direction]) return;
            const nextNodeId = node[direction].nodeId;
            renderNode(nextNodeId);
        }

        // Attach Drag Events
        swipeCard.addEventListener('mousedown', onTouchStart);
        window.addEventListener('mousemove', onTouchMove);
        window.addEventListener('mouseup', onTouchEnd);

        swipeCard.addEventListener('touchstart', onTouchStart);
        window.addEventListener('touchmove', onTouchMove);
        window.addEventListener('touchend', onTouchEnd);

        btnLeft.addEventListener('click', () => {
            swipeCard.classList.add('animating');
            swipeCard.style.transform = 'translateX(-500px) rotate(-30deg)';
            setTimeout(() => makeChoice('left'), 200);
        });

        btnRight.addEventListener('click', () => {
            swipeCard.classList.add('animating');
            swipeCard.style.transform = 'translateX(500px) rotate(30deg)';
            setTimeout(() => makeChoice('right'), 200);
        });

        restartBtn.addEventListener('click', hideEndingModal);

        // Keyboard Arrow Shortcuts
        window.addEventListener('keydown', (e) => {
            if (!endingModal.classList.contains('hidden') || !treeModal.classList.contains('hidden')) return;
            if (e.key === 'ArrowLeft') {
                btnLeft.click();
            } else if (e.key === 'ArrowRight') {
                btnRight.click();
            }
        });

        openTreeBtn.addEventListener('click', () => {
            renderTreeList();
            treeModal.classList.remove('hidden');
            setTimeout(() => {
                treeModal.classList.remove('opacity-0');
            }, 10);
        });

        closeTreeBtn.addEventListener('click', () => {
            treeModal.classList.add('opacity-0');
            setTimeout(() => {
                treeModal.classList.add('hidden');
            }, 300);
        });

        function renderTreeList() {
            treeContent.innerHTML = '';

            Object.entries(EVOLUTION_TREE).forEach(([id, node]) => {
                if (!node.isEnding) return;

                const isUnlocked = unlockedEndings.has(id);
                const itemEl = document.createElement('div');
                itemEl.className = `p-3.5 rounded-2xl border transition ${
                    isUnlocked 
                        ? 'bg-slate-800/80 border-slate-700' 
                        : 'bg-slate-900/40 border-slate-800 opacity-60'
                }`;

                itemEl.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg ${
                            isUnlocked ? node.badgeColor : 'bg-slate-800 text-slate-600'
                        }">
                            <i class="fa-solid ${isUnlocked ? node.icon : 'fa-lock'}"></i>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center space-x-2">
                                <h4 class="font-bold text-sm text-slate-200">
                                    ${isUnlocked ? node.title : '미해금 엔딩'}
                                </h4>
                                <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${
                                    isUnlocked 
                                        ? (node.endingType === 'victory' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400')
                                        : 'bg-slate-800 text-slate-500'
                                }">
                                    ${isUnlocked ? (node.endingType === 'victory' ? '성공' : '멸종') : '잠김'}
                                </span>
                            </div>
                            <p class="text-xs text-slate-400 mt-1 line-clamp-2">
                                ${isUnlocked ? node.desc : '해당 진화 분기를 탐험하여 도감을 해금하세요.'}
                            </p>
                        </div>
                    </div>
                `;
                treeContent.appendChild(itemEl);
            });
        }

        // Initialize Game On Load
        window.onload = () => {
            renderNode('pikaia');
        };
    </script>
</body>
</html>
